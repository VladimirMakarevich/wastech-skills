/* decision */
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }

.opt h3 { font-size: 1.02rem; font-weight: 700; }
.opt .sub { font-size: 0.86rem; color: var(--muted); }
.pc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 420px) { .pc { grid-template-columns: minmax(0, 1fr); } }
.pc h4 { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.pc .pro h4 { color: var(--new); } .pc .con h4 { color: var(--rem); }
.pc ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 0.83rem; color: var(--muted); }
.pc li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 6px; }
.pc .pro li::before { content: "+"; color: var(--new); font-weight: 700; }
.pc .con li::before { content: "–"; color: var(--rem); font-weight: 700; }
.chosen-tag { font-size: 0.72rem; font-weight: 700; background: var(--accent); color: #FFFFFF; padding: 3px 8px; border-radius: 999px; }
.why { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; max-width: 80ch; }

/* rules */
.rules { display: grid; max-width: 820px; }
.rule { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 640px) { .rule { grid-template-columns: 34px minmax(0, 1fr); } .rule .fail { grid-column: 2; } }
.rule .k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 0.84rem; }
.rule .q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.rule .q b { font-size: 0.92rem; }
.rule .q code { color: var(--muted); overflow-wrap: anywhere; }
.fail { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--rem-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.84rem; flex-wrap: wrap; }
.fail span { color: var(--rem); font-weight: 500; }
.fail button { border: 0; background: var(--surface); border-radius: 6px; padding: 3px 9px; font-size: 0.76rem; cursor: pointer; white-space: nowrap; }
.rule-gap { margin-left: 16px; width: 2px; height: 16px; background: var(--line); }
.rule.ok .q { border-color: var(--new); background: color-mix(in srgb, var(--new-soft) 60%, var(--surface)); }
.rule.ok .k { background: var(--new-soft); color: var(--new); }

/* data model */
.entities { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; align-items: start; }
.ent { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.ent.new { border-color: var(--new); } .ent.changed { border-color: var(--chg); } .ent.removed { border-color: var(--rem); border-style: dashed; }
.ent .eh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.ent .eh b { font-family: var(--mono); font-size: 0.86rem; overflow-wrap: anywhere; }
.ent .enote { padding: 8px 14px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.ent .f { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 7px 14px; font-size: 0.82rem; border-bottom: 1px solid var(--line); align-items: center; }

.ent .f .fn { font-family: var(--mono); overflow-wrap: anywhere; }

.ent .f.changed { background: color-mix(in srgb, var(--chg-soft) 70%, var(--surface)); }
.ent .f.removed { background: color-mix(in srgb, var(--rem-soft) 70%, var(--surface)); }
.ent .f.removed .fn { text-decoration: line-through; }
.ent .f .k { font-size: 0.66rem; font-weight: 700; color: var(--accent); }
.rel { display: flex; gap: 8px; flex-wrap: wrap; }

.seq .msg.left::after { left: -2px; border-right: 8px solid var(--muted); border-left: 0; }

.seq .row.note-row { height: auto; padding: 6px 0; }
.seq .note { position: relative; background: var(--note); color: var(--note-ink); border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; text-align: center; }
.seq .row.div-row { height: 32px; }
.seq .divider { position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dashed var(--faint); }

.states { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.state { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); }

.phase .ph { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

.bar i { display: block; height: 100%; background: var(--accent); }
.phase.done .bar i { background: var(--new); }
.phase.active { border-color: var(--foc); box-shadow: 0 0 0 3px var(--foc-soft); }
.phase.active .bar i { background: var(--foc); }

.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.nt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow); border-top: 3px solid var(--accent); }
.nt.risk { border-top-color: var(--rem); } .nt.question { border-top-color: var(--chg); } .nt.ok { border-top-color: var(--new); } .nt.out { border-top-color: var(--ex); }

.nt b { font-size: 0.94rem; }
.nt p { font-size: 0.84rem; color: var(--muted); }
.figure { background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; padding: 14px; overflow-x: auto; }
.figure img { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.caption { font-size: 0.84rem; color: var(--muted); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, 0.35); z-index: 20; }

.dr-head { display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.dr-head h3 { font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; margin-top: 6px; }
.dr-head .x { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 0.84rem; }
.dr-body { overflow-y: auto; padding: 18px 20px; display: grid; gap: 18px; align-content: start; }
.dr-body h4 { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.dr-body ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 0.88rem; }
.files { display: grid; gap: 6px; }
.files code { display: block; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font: 600 0.74rem var(--mono); background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 5px; }
.foot { font-size: 0.8rem; color: var(--faint); }

/* snapshot mode: set by build.mjs while taking PNGs */
.snapshot .toolbar, .snapshot .drawer, .snapshot .scrim { display: none !important; }
.snapshot .device { position: static; }
.snapshot body { background-image: none; }
.snapshot [data-snap] { padding: 28px 32px; background: var(--bg); }
</style>

  if (phaseCount) stats.push('<div class="stat"><span class="n">' + phaseCount + '</span><span class="l">' + esc(plural(phaseCount, L.stat.phases)) + '</span></div>');
  if (stats.length) hero += '<div class="stats">' + stats.join('') + '</div>';
  hero += '<div class="legend">' + ['new', 'changed', 'existing', 'removed', 'focus'].map(function (k) { return '<span><i class="dot ' + k + '"></i>' + esc(L.status[k]) + '</span>'; }).join('') + (cardOrder.length ? '<span>' + esc(L.legendHint) + '</span>' : '') + '</div></section>';

  // ---------- render page
  var app = document.getElementById('app');
  app.innerHTML = hero + sections.map(function (s) {
    var r = R[s.type];
    return '<section id="' + esc(s._id) + '" data-type="' + esc(s.type) + '" data-snap="' + esc(s._id) + '">' + (r ? r(s) : '<p>Unknown section type: ' + esc(s.type) + '</p>') + '</section>';
  }).join('') + (data.footer ? '<p class="foot">' + fmt(data.footer) + '</p>' : '');
  document.getElementById('nav').setAttribute('aria-label', L.sections);
  document.getElementById('nav').innerHTML = sections.map(function (s) { return '<a href="#' + esc(s._id) + '">' + esc(s.nav || s.title) + '</a>'; }).join('');
  document.getElementById('only-label').textContent = L.only;
  document.getElementById('dr-close').textContent = L.close;

  // only changes
  var only = document.getElementById('only-changes');
  function applyFilter() {
    document.querySelectorAll('[data-status]').forEach(function (el) { el.classList.toggle('dim', only.checked && el.dataset.status === 'existing'); });
  }
  only.addEventListener('change', applyFilter);

  // before / after
  sections.forEach(function (s) {
    if (s.type !== 'beforeAfter') return;
    var root = document.getElementById(s._id);
    function show(which) {
      root.querySelector('[data-ribbon]').innerHTML = ribbon(s[which]);
      root.querySelector('[data-outcome]').innerHTML = s[which].outcome ? fmt(s[which].outcome) : '';
      root.querySelectorAll('[data-ba]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ba === which)); });
      applyFilter();
    }
    root.querySelectorAll('[data-ba]').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.ba); }); });
    show('after');
  });

  // drawer
  var drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim'), opener = null;
  function openCard(id, from) {
    var c = cards[id]; if (!c) return;
    opener = from;
    document.getElementById('dr-status').innerHTML = badge(c.status || 'existing') + (c.focus ? ' ' + badge('focus') : '');
    document.getElementById('dr-title').textContent = c.name;
    var ph = phasesByCard[id] || [];
    var b = '<p>' + fmt(c.desc || '') + '</p>' + (c.note ? '<p class="caption">' + fmt(c.note) + '</p>' : '');
    if (c.changes && c.changes.length) b += '<div><h4>' + esc(L.changes) + '</h4><ul>' + c.changes.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></div>';
    if (c.files && c.files.length) b += '<div><h4>' + esc(L.files) + '</h4><div class="files">' + c.files.map(function (f) { return '<code>' + esc(f) + '</code>'; }).join('') + '</div></div>';
    if (c.reqs && c.reqs.length) b += '<div><h4>' + esc(L.reqs) + '</h4><div class="chips">' + c.reqs.map(function (r) { return '<span>' + esc(r) + '</span>'; }).join('') + '</div></div>';
    if (Object.keys(phasesByCard).length) b += '<div><h4>' + esc(L.inPhases) + '</h4><p>' + (ph.length ? ph.map(function (p) { return esc((p.n ? p.n + ' · ' : '') + p.title); }).join('<br>') : esc(L.notInPlan)) + '</p></div>';
    if (c.tags && c.tags.length) b += '<div><h4>' + esc(L.tech) + '</h4><div class="chips">' + c.tags.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div></div>';
    document.getElementById('dr-body').innerHTML = b;
    drawer.hidden = false; scrim.hidden = false;
    document.getElementById('dr-close').focus();
  }
  function closeDrawer() { drawer.hidden = true; scrim.hidden = true; if (opener) opener.focus(); }
  document.querySelectorAll('[data-card]').forEach(function (el) { el.addEventListener('click', function () { openCard(el.dataset.card, el); }); });
  document.getElementById('dr-close').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

  // plan -> architecture highlight
  var smooth = function () { return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; };
  var arch = sections.filter(function (s) { return s.type === 'architecture'; })[0];
  function clearPhase() {
    document.querySelectorAll('[data-phase-filter]').forEach(function (el) { el.hidden = true; });
    document.querySelectorAll('.card').forEach(function (c) { c.classList.remove('hl'); c.style.opacity = ''; });
  }
  document.querySelectorAll('[data-phase-reset]').forEach(function (b) { b.addEventListener('click', clearPhase); });
  document.querySelectorAll('[data-phase]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!arch) return;
      var sec = sections.filter(function (s) { return s._id === b.dataset.sec; })[0];
      var p = sec.phases[+b.dataset.phase], ids = p.cards || [];
      document.querySelectorAll('.card').forEach(function (c) {
        var on = ids.indexOf(c.dataset.card) >= 0;
        c.classList.toggle('hl', on); c.style.opacity = on ? '1' : '0.3';
      });
      var root = document.getElementById(arch._id);
      root.querySelector('[data-phase-text]').textContent = tpl(L.phaseFilter, { n: p.n || '', t: p.title });
      root.querySelector('[data-phase-filter]').hidden = false;
      root.scrollIntoView({ behavior: smooth() });
    });
  });

  // journeys: one controller per journey section
  var journeys = [];
  sections.forEach(function (s) {
    if (s.type !== 'journey') return;
    var root = document.getElementById(s._id), cur = 0;
    var screenEl = root.querySelector('[data-screen]'), urlEl = root.querySelector('[data-url]');
    var stateIds = [];
    s.steps.forEach(function (st) { if (st.screen && screensById[st.screen] && stateIds.indexOf(st.screen) < 0) stateIds.push(st.screen); });
    (s.tabs || []).forEach(function (id) { if (screensById[id] && stateIds.indexOf(id) < 0) stateIds.push(id); });
    function showScreen(id) {
      var sc = screensById[id];
      screenEl.innerHTML = screenHtml(sc);
      urlEl.textContent = sc && sc.url ? sc.url : '';
      root.querySelectorAll('[data-state-tabs] button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.state === id)); });
    }
    var counter = 0;
    root.querySelector('[data-steps]').innerHTML = s.steps.map(function (st, i) {
      var no = st.branch ? '!' : String(++counter);
      return '<li><button type="button" class="step' + (st.branch ? ' branch' : '') + '" data-step="' + i + '"><span class="no">' + no + '</span><span><span class="t">' + esc(st.title) + (st.branch ? ' <span class="badge changed">' + esc(typeof st.branch === 'string' ? st.branch : L.branch) + '</span>' : '') + '</span>' +
        (st.text ? '<span class="d">' + fmt(st.text) + '</span>' : '') + (st.ref ? '<span class="ref mono">' + esc(st.ref) + '</span>' : '') + '</span></button></li>';
    }).join('');
    function go(i) {
      cur = Math.max(0, Math.min(s.steps.length - 1, i));
      root.querySelectorAll('.step').forEach(function (el, k) { if (k === cur) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current'); });
      if (s.steps[cur].screen) showScreen(s.steps[cur].screen);
      root.querySelector('[data-prev]').disabled = cur === 0;
      root.querySelector('[data-next]').disabled = cur === s.steps.length - 1;
      root.querySelector('[data-pos]').textContent = tpl(L.stepOf, { i: cur + 1, n: s.steps.length });
    }
    root.querySelectorAll('[data-step]').forEach(function (b) { b.addEventListener('click', function () { go(+b.dataset.step); }); });
    root.querySelector('[data-prev]').addEventListener('click', function () { go(cur - 1); });
    root.querySelector('[data-next]').addEventListener('click', function () { go(cur + 1); });
    root.querySelector('[data-state-tabs]').innerHTML = stateIds.map(function (id) { return '<button type="button" data-state="' + esc(id) + '" aria-pressed="false">' + esc((screensById[id] || {}).label || id) + '</button>'; }).join('');
    root.querySelectorAll('[data-state-tabs] button').forEach(function (b) { b.addEventListener('click', function () { showScreen(b.dataset.state); }); });
    root.querySelector('[data-annos]').addEventListener('change', function (e) { root.querySelector('[data-device]').classList.toggle('annos-off', !e.target.checked); });
    go(0);
    journeys.push({ root: root, showScreen: showScreen, section: s, owns: stateIds });
  });
  // the journey that shows a screen: the one whose steps or tabs use it, else the first
  function journeyFor(id) {
    for (var i = 0; i < journeys.length; i++) if (journeys[i].owns.indexOf(id) >= 0) return journeys[i];
    return journeys[0] || null;
  }
  document.querySelectorAll('[data-show-screen]').forEach(function (b) {
    b.addEventListener('click', function () {
      var j = journeyFor(b.dataset.showScreen);
      if (!j) return;
      j.showScreen(b.dataset.showScreen);
      j.root.scrollIntoView({ behavior: smooth() });
    });
  });

  applyFilter();

  // hook for scripts/build.mjs (PNG snapshots)
  window.visual = {
    ready: true,
    sections: sections.map(function (s) { return { id: s._id, type: s.type, title: s.title }; }),
    screens: Object.keys(screensById),
    // shows a screen in its journey and returns the selector of that journey's device frame
    showScreen: function (id) { var j = journeyFor(id); if (!j) return null; j.showScreen(id); return '#' + j.section._id + ' [data-device]'; }
  };
})();
</script>
</body>
</html>
